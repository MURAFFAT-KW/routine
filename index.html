<style>/*
VOICE: هادئ وعملي، مساعد يومي لطيف بدون ضغط.
IDEA: مفكرة جيب أسبوعية؛ كل يوم شريط 24 ساعة بألوان الأنشطة.
PICTURE: حلقة إنجاز اليوم + خط زمني بأوقات كبيرة معلّقة؛ وأشرطة الأيام السبعة في الجدول.
COLOUR and TYPE: كحلي #101A32 للشريط العلوي، أزرق #427DFA للأفعال، سماوي #8DD6E7 لمسة، أبيض مزرق #EDF5FF أرضية. IBM Plex Sans Arabic.
LAYOUT: عمود واحد للجوال مع شريط تبويب سفلي؛ فوق 900px تبويب علوي وبطاقات أعرض.
*/
:root{color-scheme:light dark;
--navy:#101A32;--blue:#427DFA;--ice:#EDF5FF;--sky:#8DD6E7;
--bg:light-dark(#EDF5FF,#0B1328);--card:light-dark(#FFFFFF,#16213F);--card2:light-dark(#F5F9FF,#1C2A4E);
--ink:light-dark(#101A32,#EDF5FF);--muted:light-dark(#56627F,#A9B6D3);--line:light-dark(#D7E3F5,#2A3A63);
--ok:light-dark(#1F7A4D,#6FD3A0);--warn:light-dark(#B4532A,#F2A37B);--warnbg:light-dark(#FFF2EA,#3A2520);
--blue-ink:light-dark(#2B63E0,#8FB3FF);--blue-bg:light-dark(#E3EDFF,#1E3366)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "IBM Plex Sans Arabic",system-ui,sans-serif;overflow-x:clip}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:clamp(24px,5vw,32px);font-weight:700}h2{font-size:22px;font-weight:700}h3{font-size:17px;font-weight:600;margin-bottom:10px}
p{margin:.3em 0}
a{color:var(--blue-ink)}
.t{font-variant-numeric:tabular-nums;white-space:nowrap;unicode-bidi:isolate}
.muted{color:var(--muted)}.fine{font-size:13px;color:var(--muted)}
.app{min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}

.top{background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) max(4vw,16px) 12px}
.top-in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:12px;justify-content:space-between}
.hi{max-width:980px;margin:4px auto 0;color:var(--sky);font-size:15px}
.logo{display:inline-flex;align-items:center;gap:10px}
.logo .lt{display:flex;align-items:baseline;gap:8px}.logo b{font-size:22px;font-weight:700;color:#fff}.logo i{font-style:normal;font-size:14px;color:var(--sky);letter-spacing:.02em}
.logo.big b{font-size:34px;color:var(--ink)}.logo.big i{font-size:18px;color:var(--blue-ink)}
.tabs-d{display:none}

main{max-width:980px;margin:0 auto;padding:0 max(4vw,16px)}
.view{padding:18px 0 24px}
.vh{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px}
.pad{padding:16px;margin-top:14px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;font-size:15px}
.btn:hover{border-color:var(--blue)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ib{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.ib.light{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#fff}
.ib.sm{width:38px;height:38px;margin-inline-start:auto}
.ib:disabled{opacity:.4}
.link-btn{background:none;border:0;color:var(--blue-ink);font-weight:600;cursor:pointer;padding:8px 4px;min-height:40px}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

/* اليوم */
.datebar{display:flex;align-items:center;gap:10px;justify-content:space-between}
.dt{display:flex;flex-direction:column;align-items:center;text-align:center}.dt b{font-size:24px}.dt span{color:var(--muted);font-size:14px}
.today-top{display:flex;flex-direction:column;gap:6px;align-items:center}
.today-top .datebar{width:100%}
.hero{display:flex;align-items:center;gap:18px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-top:8px}
.ring{--p:0;flex:none;width:104px;height:104px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--blue) calc(var(--p)*1%),var(--blue-bg) 0)}
.ring>span{width:80px;height:80px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.ring b{font-size:24px}.ring small{font-size:12px;color:var(--muted)}
.ring.big{width:132px;height:132px}.ring.big>span{width:104px;height:104px}.ring.big b{font-size:30px}
.hero-t{display:flex;flex-direction:column;gap:2px}.hero-t small{color:var(--blue-ink);font-weight:600}.hero-t b{font-size:22px}.hero-t .t{color:var(--muted)}

.timeline{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
.tl{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:start}
.tl-time{display:flex;flex-direction:column;align-items:center;padding-top:12px}.tl-time .t{font-size:18px;font-weight:700}.tl-time small{font-size:12px;color:var(--muted)}
.act-card{padding:12px 14px;border-inline-start:5px solid var(--c)}
.tl.ok .act-card,.tl.mute .act-card{opacity:.72}
.tl.now .act-card{box-shadow:0 0 0 2px var(--blue)}
.ac-h{display:flex;align-items:center;gap:10px}
.chip-ic{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
:root[data-theme=dark] .chip-ic{color:color-mix(in srgb,var(--c) 55%,#fff)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .chip-ic{color:color-mix(in srgb,var(--c) 55%,#fff)}}
.ac-t{display:flex;flex-direction:column;flex:1;line-height:1.35}.ac-t b{font-size:17px}.ac-t .t{color:var(--muted);font-size:14px}
.tag{font-style:normal;font-size:11px;font-weight:600;background:var(--blue-bg);color:var(--blue-ink);border-radius:6px;padding:1px 6px;margin-inline-start:6px}
.st{flex:none;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--card2);color:var(--muted);white-space:nowrap}
.st.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.st.warn{background:var(--warnbg);color:var(--warn)}
.st.now,.st.up{background:var(--blue-bg);color:var(--blue-ink)}
.ac-a{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.empty{text-align:center;color:var(--muted);padding:40px 0}

/* الجدول */
.assist{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:14px;display:flex;flex-direction:column;gap:10px}
.assist-h{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--blue-ink)}
.conf{background:var(--warnbg);border-radius:14px;padding:12px}
.conf-h{display:flex;gap:6px;align-items:center;color:var(--warn)}
.note{background:var(--card2);border-radius:14px;padding:12px}
.okbar{display:flex;gap:8px;align-items:center;color:var(--ok);font-weight:600;margin-bottom:12px}
.sugg{background:var(--blue-bg);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:15px}
.sugg.warn{background:var(--warnbg);color:var(--warn)}
.sugg.big{margin-top:10px}
.sugg-tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--blue-ink);background:var(--card);border-radius:6px;padding:1px 7px;margin-inline-end:4px}
.info{background:var(--card2);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:14px}
.info-tag{display:flex;align-items:center;gap:4px;font-weight:700;font-size:12px;color:var(--muted)}
.info .src{font-size:13px}
.hours{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);padding:0 2px;margin-bottom:4px}
.days{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.day{padding:10px 12px}
.day.cur{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.day-h{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;width:100%;min-height:36px}
.day-h:focus-visible{outline:3px solid var(--sky)}
.dn{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.dn b{font-size:17px}.dn em{font-style:normal;font-size:12px;color:#fff;background:var(--blue);border-radius:6px;padding:0 7px}
.badd{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--warn);font-weight:600}
.dc{font-size:13px;color:var(--muted)}
.strip{position:relative;height:16px;border-radius:6px;background:var(--card2);margin-top:8px;overflow:hidden}
.strip .tick{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.strip .blk{position:absolute;top:2px;bottom:2px;border-radius:3px}
.strip .blk.thin{top:5px;bottom:5px;opacity:.85}
.strip .blk.bad{outline:2px solid var(--warn);outline-offset:-1px;z-index:1}
.day-b{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.row{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;gap:8px;align-items:center;font-size:15px;padding:4px 0;border-bottom:1px solid var(--line)}
.row small{color:var(--muted);font-size:12px;min-width:52px;text-align:end}
.row.bad b{color:var(--warn)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.day-b .btn{align-self:flex-start;margin-top:6px}
.approve-bar{position:sticky;bottom:calc(80px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--navy);color:#fff;border-radius:16px;padding:10px 12px;margin-top:14px;z-index:5}
.approve-bar span{flex:1;font-size:14px}
.diff{display:flex;align-items:center;gap:14px;justify-content:center;background:var(--card2);border-radius:14px;padding:14px;margin:10px 0}
.diff div{display:flex;flex-direction:column;align-items:center}.diff small{color:var(--muted)}.diff .t{font-size:20px;font-weight:700}

/* الملخص */
.seg{display:flex;gap:6px}
.sum-hero{display:flex;align-items:center;gap:18px;padding:16px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px;margin:0;flex:1}
.kpis dt{font-size:13px;color:var(--muted)}.kpis dd{margin:0;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.best{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.best li{display:flex;align-items:center;gap:10px}.best li span:last-child{margin-inline-start:auto;color:var(--muted);font-size:14px}
.bar-row{display:grid;grid-template-columns:76px minmax(0,1fr) 92px;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.bar{height:10px;border-radius:6px;background:var(--card2);overflow:hidden}.bar i{display:block;height:100%;border-radius:6px}
.bv{text-align:end;font-variant-numeric:tabular-nums}.bv small{color:var(--muted)}

/* الأنشطة */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:start;padding:14px;min-height:128px;border-radius:18px;border:0;cursor:pointer;color:#fff;background:var(--c)}
.tile b{font-size:18px;margin-top:6px}.tile small{font-size:13px;opacity:.9}
.tile .t{font-size:13px}
.tile-ic{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.18)}
.tile .tag{position:absolute;top:12px;inset-inline-end:12px;background:rgba(255,255,255,.22);color:#fff;margin:0}
.tile.add{background:var(--card);color:var(--blue-ink);border:2px dashed var(--blue)}
.tile.add .tile-ic{background:var(--blue-bg)}
.tiles.small .tile{min-height:96px}

/* نوافذ */
.scrim{position:fixed;inset:0;background:rgba(8,14,30,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out}
.sheet.wide{max-width:640px}
@keyframes up{from{transform:translateY(30px);opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-h h2{font-size:19px}
.sheet-b{padding:14px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.sheet-f{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.field{display:flex;flex-direction:column;gap:4px}.field>span{font-size:14px;color:var(--muted);font-weight:500}
input,select{min-height:46px;font-size:16px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--card);width:100%}
input[type=time],input[type=number],input[type=date]{direction:ltr;text-align:right}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.two.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;min-height:38px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:14px;font-weight:500}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.dim{opacity:.55}
.chip .x{all:unset;cursor:pointer;display:grid;place-items:center}
.days7 .chip{padding:0 10px}
.slot{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.row-end{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.sub{margin-top:8px;margin-bottom:0}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer}.sw.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--bg) inset}
.tog{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.tog input{width:22px;height:22px;min-height:0;accent-color:var(--blue);flex:none}
.tog small{color:var(--muted)}
.addrow{display:flex;gap:8px}.addrow select,.addrow input{flex:1}
.edrow{background:var(--card);border:1px solid var(--line);border-inline-start:5px solid var(--c);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.edrow-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.confirm{background:var(--warnbg);border-radius:14px;padding:12px}
.stack-btns{display:flex;flex-direction:column;gap:8px}.stack-btns .btn{justify-content:flex-start}
.toast{position:fixed;bottom:calc(96px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25);white-space:nowrap}
.demo-line{font-size:13px;color:var(--muted);text-align:center;padding:4px 0 12px}

.tabs-m{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
.tabs-m button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;color:var(--muted);font-size:12px;font-weight:600}
.tabs-m button.on{color:var(--blue-ink);background:var(--blue-bg)}
.tabs-m button:focus-visible{outline:3px solid var(--sky)}

/* الإعداد الأولي */
.ob{min-height:100vh;display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top)) 14px 24px;background:linear-gradient(180deg,var(--navy) 0 220px,var(--bg) 220px)}
.ob-card{width:100%;max-width:600px;padding:22px 18px;display:flex;flex-direction:column;gap:12px}
.ob-card h1{font-size:28px;margin-top:8px}
.steps{display:flex;gap:4px}.steps span{flex:1;font-size:11px;color:var(--muted);border-top:4px solid var(--line);padding-top:4px;text-align:center}.steps span.on{border-color:var(--blue);color:var(--blue-ink);font-weight:600}
.ob-nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.obacts{display:flex;flex-direction:column;gap:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px}.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:10px;height:10px;border-radius:3px}
.days.mini li{display:grid;grid-template-columns:64px minmax(0,1fr);align-items:center;gap:8px}.days.mini b{font-size:14px}.days.mini .strip{margin:0}
.why{margin:0;padding-inline-start:18px;display:flex;flex-direction:column;gap:4px;font-size:15px}

@media (min-width:600px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}.bar-row{grid-template-columns:110px minmax(0,1fr) 120px}
.scrim{align-items:center}.sheet{border-radius:22px}}
@media (min-width:900px){
.app{padding-bottom:24px}.tabs-m{display:none}
.tabs-d{display:flex;gap:4px;background:rgba(255,255,255,.06);border-radius:14px;padding:4px}
.tabs-d button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;color:#C9D6F0;font-weight:600;font-size:15px}
.tabs-d button.on{background:var(--blue);color:#fff}
.tabs-d button:focus-visible{outline:3px solid var(--sky)}
.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
.approve-bar{bottom:16px}.toast{bottom:24px}
.today-top{flex-direction:row;flex-wrap:wrap}.today-top .datebar{width:auto;flex:1}.hero{flex:1.4;margin-top:0}
}

@media (min-width:900px){.row{grid-template-columns:10px minmax(0,11em) auto 1fr}.row small{text-align:start}}

/* مربعات اليوم */
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.dtile{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:12px;min-height:118px;border-radius:18px;background:var(--c);color:#fff;position:relative}
.dtile:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.dtile b{font-size:18px;margin-top:auto}
.dtile .t{font-size:14px;opacity:.92}
.dtile-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.dtile .tile-ic{width:36px;height:36px;border-radius:11px}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.22);white-space:nowrap}
.dtile.ok{opacity:.62}.dtile.ok .badge{background:#fff;color:#1F7A4D}
.dtile.mute{opacity:.45}
.dtile.warn .badge{background:#FFE1D2;color:#9A3F16}
.dtile.now{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--blue)}
.dtile.now .badge{background:#fff;color:var(--blue)}
.dtile.add{background:var(--card);color:var(--blue-ink);border:2px dashed var(--blue)}
.dtile.add .tile-ic{background:var(--blue-bg)}
.det{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.det>div{flex:1;display:flex;flex-direction:column}.det .t{font-size:20px;font-weight:700}.det small{color:var(--muted)}
.chip-ic.big{width:52px;height:52px;border-radius:15px}
.cline{display:flex;align-items:center;gap:8px;color:var(--warn);background:var(--warnbg);border-radius:12px;padding:8px 10px}
.cline span{flex:1;color:var(--ink);font-size:15px}
.cline .btn{flex:none}
/* اختيار الأنشطة */
.pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ptile{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:96px;padding:10px 6px;border-radius:16px;background:var(--card2);border:2px solid var(--line);color:var(--ink);text-align:center}
.ptile b{font-size:14px}
.ptile .tile-ic{background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.ptile.on{background:var(--c);border-color:var(--c);color:#fff}.ptile.on .tile-ic{background:rgba(255,255,255,.2);color:#fff}
.ptile:focus-visible{outline:3px solid var(--sky)}
.tick-c{position:absolute;top:6px;inset-inline-start:6px;width:22px;height:22px;border-radius:50%;background:#fff;color:var(--c);display:grid;place-items:center}
/* الطي */
.acc{display:flex;flex-direction:column;gap:8px}
.acc-i{border:1px solid var(--line);border-inline-start:5px solid var(--c);border-radius:14px;background:var(--card)}
.acc-h{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;min-height:56px}
.acc-h:focus-visible{outline:3px solid var(--sky)}
.acc-t{flex:1;display:flex;flex-direction:column;line-height:1.35}.acc-t small{color:var(--muted);font-size:13px}
.acc-chev{color:var(--muted)}
.acc-b{padding:4px 12px 14px;display:flex;flex-direction:column;gap:10px}
.link-btn.skip{margin-inline-start:auto;color:var(--muted)}
@media (min-width:600px){.dgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.pick{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media (min-width:900px){.dgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.notice h1{font-size:26px}
.nlist{list-style:none;margin:4px 0 6px;padding:0;display:flex;flex-direction:column;gap:10px}
.nlist li{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.55}
.nlist svg{flex:none;margin-top:3px;color:var(--blue-ink)}
.center{text-align:center}
a.btn{text-decoration:none;color:inherit}a.btn.pri{color:#fff}
.splash{all:unset;box-sizing:border-box;cursor:pointer;position:fixed;inset:0;background:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.splash b{font-size:clamp(56px,16vw,84px);font-weight:700;line-height:1.1;margin-top:18px}
.splash i{font-style:normal;font-size:22px;color:var(--sky);letter-spacing:.04em}
.splash-mark{animation:spin 1.6s ease-out}
.splash b,.splash i{animation:rise .8s ease-out both}.splash i{animation-delay:.15s}
@keyframes spin{from{transform:rotate(-200deg);opacity:0}to{transform:rotate(0);opacity:1}}
@keyframes rise{from{transform:translateY(12px);opacity:0}}
@media (prefers-reduced-motion:reduce){.splash-mark,.splash b,.splash i{animation:none}}
.intro h1{font-size:26px}
